<body class="min-h-screen flex flex-col">
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-outline-variant/30">
    <div class="max-w-7xl mx-auto px-6 lg:px-8 flex items-center justify-between h-16 gap-4">
      <a href="/" class="text-on-surface font-semibold" aria-label="Metricus home">Metricus <span class="font-normal text-on-surface-variant">Optimizer</span></a>
      <div class="flex items-center gap-5">
        <a href="/blog/" class="text-sm text-on-surface-variant hover:text-on-surface">Learn</a>
        <a href="/ai-visibility-optimizer-tool/" class="bg-primary text-on-primary text-sm font-semibold px-4 py-2.5 hover:bg-primary-dim">Open the tool</a>
      </div>
    </div>
  </header>

  <main class="flex-grow pt-16">
    <article class="max-w-3xl mx-auto px-6 py-14 prose-plain">
<h1 class="text-4xl md:text-5xl font-bold text-slate-text tracking-tight leading-tight mb-5">Let's talk</h1><p class="text-lg text-on-surface leading-relaxed mb-8">Tell us what you are working on. We reply within a day.</p>
      <form id="contactForm" class="mt-4 max-w-xl">
        <label for="email" class="block text-sm text-on-surface-variant font-semibold mb-2">Email address</label>
        <input type="email" id="email" name="email" required placeholder="you@company.com" class="w-full px-4 py-3 mb-6 border border-outline-variant bg-white text-on-surface">
        <label for="message" class="block text-sm text-on-surface-variant font-semibold mb-2">What are you working on?</label>
        <textarea id="message" name="message" rows="5" required placeholder="Which client pages you want to run the optimizer on, a question about the tool, or anything else." class="w-full px-4 py-3 mb-6 border border-outline-variant bg-white text-on-surface resize-none"></textarea>
        <button type="submit" id="submitBtn" class="bg-primary text-on-primary font-semibold px-6 py-3 hover:bg-primary-dim">Send</button>
      </form>
      <div id="successMsg" class="hidden mt-8 border border-outline-variant/50 p-6">
        <p class="font-semibold text-slate-text mb-1">Received.</p>
        <p class="text-on-surface-variant text-sm">We reply within a day at the address you gave.</p>
      </div>
      <script>
        var SW_LOGS_URL = 'https://metricus-studio-logs.red-hill-a87d.workers.dev/';
        var SW_UID = (function() { try { var u = localStorage.getItem('metricus_uid'); if (!u) { u = (crypto.randomUUID && crypto.randomUUID()) || ('uid-' + Math.random().toString(36).slice(2) + Date.now().toString(36)); localStorage.setItem('metricus_uid', u); } return u; } catch (e) { return 'uid-' + Math.random().toString(36).slice(2) + Date.now().toString(36); } })();
        var SW_SID = (function() { try { var s = sessionStorage.getItem('metricus_sid'); if (!s) { s = (crypto.randomUUID && crypto.randomUUID()) || ('sid-' + Math.random().toString(36).slice(2) + Date.now().toString(36)); sessionStorage.setItem('metricus_sid', s); } return s; } catch (e) { return 'sid-' + Math.random().toString(36).slice(2) + Date.now().toString(36); } })();
        document.getElementById('contactForm').addEventListener('submit', function(e) {
          e.preventDefault();
          var email = document.getElementById('email').value.trim();
          var message = document.getElementById('message').value.trim();
          fetch(SW_LOGS_URL, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ uid: SW_UID, sid: SW_SID, event: 'CONTACT', value: { contact: email, details: 'Message: ' + message } }), keepalive: true }).catch(function() {});
          document.getElementById('contactForm').classList.add('hidden');
          document.getElementById('successMsg').classList.remove('hidden');
        });
      </script>
      
      
    </article>
